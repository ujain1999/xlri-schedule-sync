services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: .env
    # Not published to the host: quick-deploy's shared Traefik reaches it over
    # the `qd` network and routes <name>.<domain> here.
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
